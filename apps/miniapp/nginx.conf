server {
    listen 3002;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "ALLOW-FROM https://web.telegram.org" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Telegram Mini Apps run inside Telegram webviews.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-ancestors https://web.telegram.org;" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
